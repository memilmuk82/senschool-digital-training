<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>네이버웍스 기반 학교 업무 효율화</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div id="stage-shell"><div id="stage"></div></div>
      <nav id="controls" aria-label="슬라이드 조작">
        <button id="prev" type="button" aria-label="이전 슬라이드">←</button>
        <button id="overview-toggle" type="button">▦ 개요</button>
        <span id="counter"></span>
        <button id="print" type="button">⇩ PDF</button>
        <a class="control-link" href="./downloads/네이버웍스_기반_학교_업무_효율화_90분_연수_완성본.pptx" download>⇩ PPTX</a>
        <button id="notes-toggle" type="button">≡ 강사 노트</button>
        <button id="fullscreen" type="button">⛶ 전체화면</button>
        <button id="next" type="button" aria-label="다음 슬라이드">→</button>
      </nav>
      <div id="progress"><span></span></div>
      <aside id="notes"></aside>
      <section id="overview"></section>
      <div id="key-help">← → 이동 · O 개요 · N 노트 · P PDF · F 전체화면</div>
    </main>
    <script src="./deck-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
